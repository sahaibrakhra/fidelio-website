Fidelio is an initative to create a free and open-source sandbox to examine and represent pure mathematical objects and their relationships. 
It is a project that aims to provide a platform for mathematicians, educators, and students to explore mathematical concepts in an intuitive
and interactive way. The goal is to make pure mathematics more accessible and engaging by allowing users to manipulate and visualize 
mathematical structures, such as graphs, functions, and geometric shapes. Fidelio encourages collaboration and sharing of mathematical 
ideas, fostering a community of learners and enthusiasts who can contribute to the development of the platform.
-->
